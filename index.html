<!-- SISTEMA UMADECAMPI COMPLETO CORRIGIDO -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>UMADECAMPI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f4f7fb;margin:0;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px}
h2{margin-bottom:10px}
select,input{width:100%;padding:10px;margin-bottom:10px}
button{padding:10px;background:#16a34a;color:#fff;border:none;border-radius:8px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
</style>
</head>

<body>

<div class="card">
<h2>Lançar Pedido</h2>

<select id="setorPedido"></select>
<select id="congregacaoPedido"></select>

<select id="modelo">
<option>Masculino</option>
<option>Baby Look Feminina</option>
</select>

<select id="tamanho">
<option>P</option><option>M</option><option>G</option>
</select>

<input id="quantidade" type="number" value="1">
<button onclick="salvarPedido()">Salvar Pedido</button>
</div>

<div class="card">
<h2>Lançar Recebimento</h2>

<select id="setorReceb"></select>
<select id="congregacaoReceb"></select>

<input id="valor" type="number" placeholder="Valor">
<button onclick="salvarReceb()">Salvar Recebimento</button>
</div>

<div class="card">
<h2>Resumo Igrejas</h2>

<p>Pediram: <span id="pediram">0</span></p>
<p>Não pediram: <span id="nao">0</span></p>
<p>Quites: <span id="quitado">0</span></p>
<p>Parcial: <span id="parcial">0</span></p>
<p>Pendentes: <span id="pendente">0</span></p>
</div>

<div class="card">
<h2>Pedidos</h2>
<table>
<thead><tr><th>Congregação</th><th>Qtd</th></tr></thead>
<tbody id="pedidos"></tbody>
</table>
</div>

<div class="card">
<h2>Recebimentos</h2>
<table>
<thead><tr><th>Congregação</th><th>Valor</th></tr></thead>
<tbody id="recebimentos"></tbody>
</table>
</div>

<script>
const URL = "https://dqwlhouwoxbwxkcaytja.supabase.co/rest/v1/";
const KEY = "sb_publishable_b_tuFrU9PhG3VKYLupMVhg_pWPF6Spj";

async function api(tabela, method="GET", body=null){
const res = await fetch(URL+tabela,{
method,
headers:{
apikey:KEY,
Authorization:"Bearer "+KEY,
"Content-Type":"application/json"
},
body:body?JSON.stringify(body):null
});
return await res.json();
}

let setores=[],congregacoes=[],pedidos=[],recebimentos=[];

async function carregar(){
setores = await api("setores");
congregacoes = await api("congregacoes");
pedidos = await api("pedidos");
recebimentos = await api("recebimentos");

popular();
render();
}

function popular(){
const s1=document.getElementById("setorPedido");
const s2=document.getElementById("setorReceb");

s1.innerHTML=s2.innerHTML=setores.map(s=>`<option value="${s.id}">${s.nome}</option>`).join("");

atualizarCongregacoes();
}

function atualizarCongregacoes(){
const setor=document.getElementById("setorPedido").value;

const lista=congregacoes.filter(c=>c.setor_id==setor);

document.getElementById("congregacaoPedido").innerHTML=
lista.map(c=>`<option value="${c.id}">${c.nome}</option>`).join("");

document.getElementById("congregacaoReceb").innerHTML=
lista.map(c=>`<option value="${c.id}">${c.nome}</option>`).join("");
}

document.getElementById("setorPedido").onchange=atualizarCongregacoes;

async function salvarPedido(){
await api("pedidos","POST",{
setor_id:document.getElementById("setorPedido").value,
congregacao_id:document.getElementById("congregacaoPedido").value,
quantidade:document.getElementById("quantidade").value
});
carregar();
}

async function salvarReceb(){
await api("recebimentos","POST",{
setor_id:document.getElementById("setorReceb").value,
congregacao_id:document.getElementById("congregacaoReceb").value,
valor:document.getElementById("valor").value
});
carregar();
}

function render(){
document.getElementById("pedidos").innerHTML=
pedidos.map(p=>{
const c=congregacoes.find(x=>x.id==p.congregacao_id);
return `<tr><td>${c?.nome}</td><td>${p.quantidade}</td></tr>`;
}).join("");

document.getElementById("recebimentos").innerHTML=
recebimentos.map(r=>{
const c=congregacoes.find(x=>x.id==r.congregacao_id);
return `<tr><td>${c?.nome}</td><td>${r.valor}</td></tr>`;
}).join("");

const resumo=congregacoes.map(c=>{
const p=pedidos.filter(x=>x.congregacao_id==c.id);
const r=recebimentos.filter(x=>x.congregacao_id==c.id);

const qtd=p.reduce((a,b)=>a+Number(b.quantidade),0);
const total=qtd*45;
const recebido=r.reduce((a,b)=>a+Number(b.valor),0);

return{qtd,total,recebido};
});

document.getElementById("pediram").innerText=resumo.filter(x=>x.qtd>0).length;
document.getElementById("nao").innerText=resumo.filter(x=>x.qtd==0).length;
document.getElementById("quitado").innerText=resumo.filter(x=>x.recebido>=x.total && x.total>0).length;
document.getElementById("parcial").innerText=resumo.filter(x=>x.recebido>0 && x.recebido<x.total).length;
document.getElementById("pendente").innerText=resumo.filter(x=>x.qtd>0 && x.recebido==0).length;
}

carregar();
</script>

</body>
</html>
