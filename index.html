<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Oficial - Pedidos UMADECAMPI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="stats">
      <div class="card"><span class="stat" id="statAdminPecas">0</span><p>Peças Totais</p></div>
      <div class="card"><span class="stat" id="statAdminTotal">R$ 0,00</span><p>Valor Total</p></div>
      <div class="card"><span class="stat" id="statAdminRecebido">R$ 0,00</span><p>Recebido</p></div>
    </div>

    <section id="telaLogin" class="card">
      <h3>Login Administrativo</h3>
      <form id="formLoginAdmin">
        <input id="loginAdmin" type="text" placeholder="Usuário" required />
        <input id="senhaAdmin" type="password" placeholder="Senha" required />
        <button class="primary" type="submit">Entrar</button>
      </form>
    </section>

    <section id="painelAdmin" class="hidden">
      <div class="card">
        <div style="display:flex; justify-content: space-between;">
          <h3>Painel do Administrador</h3>
          <button id="btnLogoutAdmin" class="danger btn-sm">Sair</button>
        </div>

        <div class="grid-2">
          <div class="card">
            <h3>Lançar Pedido</h3>
            <form id="formPedidoAdmin">
              <label>Setor</label><select id="pedidoAdminSetor" required></select>
              <label>Congregação</label><select id="pedidoAdminCongregacao" required></select>
              <label>Modelo</label>
              <select id="pedidoAdminModelo" required>
                <option value="Masculino">Masculino</option>
                <option value="Baby Look Feminina">Baby Look Feminina</option>
                <option value="Infantil">Infantil</option>
              </select>
              <label>Tamanho</label><select id="pedidoAdminTamanho" required></select>
              <label>Qtd</label><input id="pedidoAdminQuantidade" type="number" value="1" />
              <button class="success" type="submit">Salvar Pedido</button>
            </form>
          </div>

          <div class="card">
            <h3>Lançar Recebimento</h3>
            <form id="formRecebimentoAdmin">
              <label>Setor</label><select id="recebimentoSetor" required></select>
              <label>Congregação</label><select id="recebimentoCongregacao" required></select>
              <label>Valor (R$)</label><input id="recebimentoValor" type="number" step="0.01" required />
              <button class="primary" type="submit">Salvar Pagamento</button>
            </form>
          </div>
        </div>

        <div class="card">
          <h3>Resumo Geral das Igrejas</h3>
          <div class="toolbar" style="display: flex; gap: 10px; margin-bottom: 10px;">
            <select id="filtroSetorVisualizacao"></select>
            <input id="buscaVisualizacao" type="text" placeholder="Buscar igreja..." />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Setor</th><th>Congregação</th><th>Qtd</th><th>Total</th><th>Pago</th><th>Saldo</th></tr>
              </thead>
              <tbody id="tbodyVisualizacaoAdmin"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
