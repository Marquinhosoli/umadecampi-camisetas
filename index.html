<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Oficial - Pedidos UMADECAMPI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="stats">
      <div class="card"><span class="stat" id="statSetores">0</span><p>Setores</p></div>
      <div class="card"><span class="stat" id="statIgrejas">0</span><p>Igrejas</p></div>
      <div class="card"><span class="stat" id="statPedidos">0</span><p>Pedidos</p></div>
      <div class="card"><span class="stat" id="statAdminPecas">0</span><p>Peças (Admin)</p></div>
      <div class="card"><span class="stat" id="statAdminTotal">R$ 0,00</span><p>Total Geral</p></div>
    </div>

    <section id="painelAdmin" class="hidden">
      <div class="card">
        <h3>Painel Administrativo</h3>
        <div class="grid-2">
          <div class="card">
            <h3>Lançar pedido (Admin)</h3>
            <form id="formPedidoAdmin">
              <label>Setor</label><select id="pedidoAdminSetor" required></select>
              <label>Congregação</label><select id="pedidoAdminCongregacao" required></select>
              <label>Modelo</label>
              <select id="pedidoAdminModelo" required>
                <option value="Masculino">Masculino</option>
                <option value="Baby Look Feminina">Baby Look Feminina</option>
                <option value="Infantil">Infantil</option>
              </select>
              <label>Tamanho</label><select id="pedidoAdminTamanho" required></select>
              <label>Quantidade</label><input id="pedidoAdminQuantidade" type="number" min="1" value="1" required />
              <button class="success" type="submit">Salvar pedido</button>
            </form>
          </div>

          <div class="card">
            <h3>Lançar Recebimento</h3>
            <form id="formRecebimentoAdmin">
              <label>Setor</label><select id="recebimentoSetor" required></select>
              <label>Congregação</label><select id="recebimentoCongregacao" required></select>
              <label>Valor (R$)</label><input id="recebimentoValor" type="number" step="0.01" required />
              <label>Observação</label><input id="recebimentoObs" type="text" />
              <button class="primary" type="submit">Salvar Pagamento</button>
            </form>
          </div>
        </div>

        <div class="card">
          <h3>Visualização Rápida</h3>
          <div class="toolbar">
            <select id="filtroSetorVisualizacao"></select>
            <input id="buscaVisualizacao" type="text" placeholder="Buscar congregação..." />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Setor</th><th>Congregação</th><th>Qtd</th><th>Total</th><th>Recebido</th><th>Saldo</th></tr>
              </thead>
              <tbody id="tbodyVisualizacaoAdmin"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
