<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Oficial - UMADECAMPI</title>
  <link rel="stylesheet" href="styles.css" />
  <style>.hidden { display: none !important; }</style>
</head>
<body>
  <div class="container">
    <div class="card hero-card">
      <div class="hero-info">
        <h1>SISTEMA OFICIAL</h1>
        <h2>Pedidos UMADECAMPI</h2>
        <p>Controle por setor, congregação e financeiro</p>
      </div>
      <div class="hero-actions">
        <span class="pill pill-info">CAMPANHA ATIVA</span>
        <span class="pill pill-info">PRAZO ABERTO</span>
      </div>
    </div>

    <div class="stats">
      <div class="card"><span class="stat" id="statSetores">0</span><p>Setores</p></div>
      <div class="card"><span class="stat" id="statIgrejas">0</span><p>Igrejas</p></div>
      <div class="card"><span class="stat" id="statPedidos">0</span><p>Pedidos</p></div>
      <div class="card"><span class="stat" id="statAdminPecas">0</span><p>Peças Totais</p></div>
      <div class="card"><span class="stat" id="statAdminTotal">R$ 0,00</span><p>Total Geral</p></div>
    </div>

    <section id="painelAdmin" class="hidden">
      <div class="card">
        <h3>Lançar Pedido</h3>
        <form id="formPedidoAdmin">
          <label>Setor</label><select id="pedidoAdminSetor" required></select>
          <label>Modelo</label>
          <select id="pedidoAdminModelo" required>
            <option value="Masculino">Masculino</option>
            <option value="Baby Look Feminina">Baby Look Feminina</option>
            <option value="Infantil">Infantil</option>
          </select>
          <label>Tamanho</label><select id="pedidoAdminTamanho" required></select>
          <button class="success" type="submit">Salvar Pedido</button>
        </form>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
